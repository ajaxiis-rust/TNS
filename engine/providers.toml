# providers.toml — внешние провайдеры: заводские модели и справочник цен.
#
# Ядро читает этот файл при каждом запросе (карточки «Провайдеры» и список
# моделей), поэтому правка цены или заводской модели применяется без пересборки
# ядра. Файл лежит рядом с settings.toml в корне работающей папки.
#
# [defaults] — заводская модель пресета, пока в settings.toml нет выбора.
#   Ключ — имя пресета из реестра workshop (slots.default в config.yaml).
# [[models]] — справочник моделей: цена за 1M токенов в USD, вход и выход.
#   API Gemini цен не отдаёт, поэтому цены и примечания живут только здесь.
#   Цена 0/0 без чисел — модель отключена; в интерфейсе показывается note.

[defaults]
"gemini-flash" = "gemini-3.8-flash"
"gemini-pro" = "gemini-3.1-pro-preview"

[[models]]
id = "gemini-4-carbon"
input_usd_per_m = 2.00
output_usd_per_m = 10.00
note = "до 30.11.2026"

[[models]]
id = "gemini-4-argon"
input_usd_per_m = 2.00
output_usd_per_m = 10.00
note = "до 30.11.2026"

