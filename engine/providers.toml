# providers.toml — внешние провайдеры генерации: адрес, протокол, заводская
# модель и справочник цен.
#
# Ядро читает этот файл при каждом запросе (карточки «Провайдеры», список
# моделей), поэтому добавление провайдера, правка заводской модели или цены не
# требуют пересборки. Для слотов Ткача файл читается при старте ядра — новый
# slots.default применяется после перезапуска.
#
# [[providers]] — внешний слот:
#   name          — имя пресета: сюда же пишется ключ в settings.toml и
#                   значение slots.default в config.yaml;
#   label         — человекочитаемое имя в интерфейсе (необязательно);
#   protocol      — gemini (generateContent) или openai (/chat/completions);
#   base_url      — база без /chat/completions: для openai дописывается
#                   /chat/completions и /models, для gemini — /v1beta/…;
#   default_model — заводская модель, пока в settings.toml нет выбора;
#   models        — курируемый список моделей (необязательно): если задан,
#                   «Список» показывает его без сети и без ключа.
#
# [[models]] — справочник цен: id модели, цена за 1M токенов в USD (вход и
# выход), примечание. Провайдеры цены через API не отдают. Модели, которых нет
# в справочнике, показываются с «цена неизвестна».
#
# Хост каждого провайдера должен быть в netgate.allowed_hosts (config.yaml),
# иначе запрос не выйдет наружу.

# --- Провайдеры (по алфавиту) ----------------------------------------------

[[providers]]
name = "cerebras"
label = "Cerebras"
protocol = "openai"
base_url = "https://api.cerebras.ai/v1"
default_model = "llama-3.3-70b"

