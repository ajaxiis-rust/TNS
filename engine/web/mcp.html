<div class="mcp">
  <section class="mcp-section" aria-label="Дашборд ковки">
    <h2 data-i18n="mcp.forge.title">Дашборд ковки</h2>
    <div class="mcp-dash">
      <p class="mcp-dash__line" id="mcp-dash-queue"></p>
      <p class="mcp-dash__line" id="mcp-dash-current"></p>
    </div>
    <dl class="mcp-stats" id="mcp-dash-stats"></dl>
  </section>

  <section class="mcp-section" aria-label="Книги-источники">
    <h2 data-i18n="mcp.books.title">Книги-источники</h2>
    <form class="mcp-import" id="mcp-import-form">
      <input type="file" id="mcp-import-file" accept=".txt,.md,.fb2">
      <button type="submit" id="mcp-import-submit" data-i18n="mcp.books.import">Импорт</button>
    </form>
    <button type="button" class="mcp-forge" id="mcp-forge" data-i18n="mcp.books.forge">Запустить ковку</button>
    <div class="mcp-books" id="mcp-books"></div>
  </section>

  <section class="mcp-section" aria-label="Кольца Паганеля">
    <h2 data-i18n="mcp.rings.title">Кольца Паганеля</h2>
    <div class="mcp-rings" id="mcp-rings"></div>
  </section>

  <section class="mcp-section" aria-label="Инструменты станка">
    <h2 data-i18n="mcp.tools.title">Инструменты станка</h2>
    <div class="mcp-tools" id="mcp-tools">
      <button type="button" id="mcp-coeffs-open" data-i18n="mcp.coeffs.open">Коэффициенты</button>
      <div class="mcp-lemmatizer" id="mcp-lemmatizer"></div>
      <label class="mcp-lemmatizer__toggle">
        <input type="checkbox" id="mcp-lemmatizer-enabled">
        <span data-i18n="mcp.lemmatizer.disabled">Без лемматизатора</span>
      </label>
    </div>

    <div class="mcp-modal" id="mcp-coeffs-modal" hidden>
      <div class="mcp-modal__panel">
        <h3 data-i18n="mcp.coeffs.title">Коэффициенты</h3>
        <p class="mcp-modal__warning" id="mcp-coeffs-warning" data-i18n="mcp.coeffs.warning">Меняет пересчёт и логику ходов.</p>
        <form id="mcp-coeffs-form">
          <fieldset>
            <legend data-i18n="mcp.coeffs.confirm">Подтверждение</legend>
            <label><span data-i18n="mcp.coeffs.dict_threshold">Порог словаря</span><input id="coeff-confirm-dict-threshold" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.vector_threshold">Порог вектора</span><input id="coeff-confirm-vector-threshold" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.margin_dict">Запас словаря</span><input id="coeff-confirm-margin-dict" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.margin_vector">Запас вектора</span><input id="coeff-confirm-margin-vector" type="number" step="0.01" min="0" max="1"></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="mcp.coeffs.sediment">Оседание</legend>
            <label><span data-i18n="mcp.coeffs.dedup_threshold">Порог дедупликации</span><input id="coeff-sediment-dedup-threshold" type="number" step="0.01" min="0" max="1"></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="mcp.coeffs.saw">Сигнал глубины</legend>
            <label><span data-i18n="mcp.coeffs.rise_min">Наклон минимум</span><input id="coeff-saw-rise-min" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.rise_max">Наклон максимум</span><input id="coeff-saw-rise-max" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.peak">Пик</span><input id="coeff-saw-peak" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.fall">Разрядка</span><input id="coeff-saw-fall" type="number" step="0.01" min="0" max="1"></label>
            <label><span data-i18n="mcp.coeffs.flat">Ровный участок</span><input id="coeff-saw-flat" type="number" step="0.01" min="0" max="1"></label>
          </fieldset>
          <fieldset>
            <legend data-i18n="mcp.coeffs.time">Время</legend>
            <label><span data-i18n="mcp.coeffs.night_threshold_min">Порог ночи, минут</span><input id="coeff-time-night-threshold-min" type="number" step="1" min="1"></label>
          </fieldset>
        </form>
        <button type="button" id="mcp-coeffs-save" data-i18n="mcp.coeffs.save">Сохранить</button>
        <button type="button" id="mcp-coeffs-close" data-i18n="mcp.coeffs.cancel">Отмена</button>
      </div>
    </div>
  </section>
</div>
