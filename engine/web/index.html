<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">TNS65</title>
  <script src="/static/theme-init.js"></script>
  <link rel="stylesheet" href="/static/theme.css">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/names.js" defer></script>
  <script src="/static/i18n.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script src="/static/chat.js" defer></script>
  <script src="/static/providers.js" defer></script>
</head>
<body>
  <nav class="menu-bar" id="menu-bar" aria-label="Основное меню">
    <div class="menu-bar__brand">
      <svg class="menu-bar__mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"></path>
        <path d="M12 3v2M12 19v2M3 12h2M19 12h2"></path>
      </svg>
      <span class="menu-bar__wordmark">TNS</span>
      <span class="menu-bar__version">v0.65</span>
    </div>
    <div class="menu-bar__tabs">
      <button class="tab" id="tab-atlas" data-view="atlas" data-i18n="menu.atlas"></button>
      <button class="tab" id="tab-history" data-view="history" data-i18n="menu.history"></button>
      <button class="tab" id="tab-mcp" data-view="mcp" data-i18n="menu.mcp"></button>
      <button class="tab" id="tab-settings" data-view="settings" data-i18n="menu.settings"></button>
      <button class="tab tab-chat" id="tab-chat" data-view="chat" data-i18n="menu.chat" hidden></button>
    </div>
    <div class="menu-bar__status">
      <span class="menu-bar__status-chip"><i aria-hidden="true"></i><span data-i18n="menu.engine">движок онлайн</span></span>
    </div>
  </nav>

  <main class="views" id="views">
    <section class="view view-chat" id="view-chat" aria-label="Чат">
      <div class="chat">
        <div class="state-panel" id="state-panel" aria-label="Мир, герой и система">
          <div class="state" id="world-panel"></div>
          <div class="state" id="hero-panel"></div>
          <div class="state" id="system-panel"></div>
        </div>
        <div class="chat-log" id="chat-log" aria-label="Журнал чата"></div>
        <div class="composer">
          <div class="composer-in">
            <form class="input-row" id="chat-form">
              <input type="text" id="chat-input" autocomplete="off">
              <button type="submit" id="chat-send" class="send">
                <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m4 11 16-7-6.5 16-3.2-6.4L4 11Z"/><path d="m10.3 13.6 3.4-3.4"/></svg>
              </button>
            </form>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="view-atlas" hidden>
      <h1 data-i18n="menu.atlas"></h1>
    </section>
    <section class="view" id="view-history" hidden>
      <h1 data-i18n="menu.history"></h1>
    </section>
    <section class="view" id="view-mcp" hidden>
      <h1 data-i18n="menu.mcp"></h1>
    </section>
    <section class="view" id="view-settings" hidden>
      <h1 data-i18n="menu.settings"></h1>
    </section>
  </main>
</body>
</html>
