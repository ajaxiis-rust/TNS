<div class="atlas">
  <section class="atlas-section atlas-worlds-section" aria-label="Миры">
    <h2 data-i18n="atlas.worlds">Миры</h2>
    <div class="atlas-worlds" id="atlas-worlds"></div>
  </section>

  <section class="atlas-section atlas-birth-section" aria-label="Анкета рождения">
    <h2 data-i18n="atlas.birth.title">Анкета рождения</h2>
    <form class="atlas-form" id="atlas-birth-form">
      <label class="atlas-field">
        <span data-i18n="atlas.slug">Слаг мира (латиницей)</span>
        <input id="atlas-birth-slug" name="slug" required>
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.title">Заголовок мира</span>
        <input id="atlas-birth-title" name="title">
      </label>
      <label class="atlas-field atlas-field--wide">
        <span data-i18n="atlas.description">Описание мира</span>
        <textarea id="atlas-birth-description" name="description"></textarea>
      </label>
      <label class="atlas-field atlas-field--wide">
        <span data-i18n="atlas.synopsis">Синопсис (1–3 предложения)</span>
        <textarea id="atlas-birth-synopsis" name="synopsis"></textarea>
      </label>
      <label class="atlas-field atlas-field--wide">
        <span data-i18n="atlas.prologue">Пролог</span>
        <textarea id="atlas-birth-prologue" name="prologue"></textarea>
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.lang">Язык мира</span>
        <input id="atlas-birth-lang" name="lang" value="ru">
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.travel_mode">Режим походов</span>
        <input id="atlas-birth-travel-mode" name="travel_mode" value="вымышленная">
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.genres">Жанры (через запятую)</span>
        <input id="atlas-birth-genres" name="genres" value="фэнтези">
      </label>
      <label class="atlas-field atlas-field--wide">
        <span data-i18n="atlas.world_rules">Правила мира (по одному на строку)</span>
        <textarea id="atlas-birth-world-rules" name="world_rules"></textarea>
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.social_order">Социальный строй</span>
        <input id="atlas-birth-social-order" name="social_order" value="феодализм">
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.economy_mods">Экономические модификаторы (через запятую)</span>
        <input id="atlas-birth-economy-mods" name="economy_mods">
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.magic">Магия</span>
        <input id="atlas-birth-magic" name="magic">
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.hero_birth">Рождение героя</span>
        <input id="atlas-birth-hero-birth" name="hero_birth">
      </label>
      <label class="atlas-field">
        <span data-i18n="atlas.censorship">Цензура (16+/18+)</span>
        <input id="atlas-birth-censorship" name="censorship" value="16+">
      </label>
      <button type="submit" id="atlas-birth-submit" data-i18n="atlas.birth.submit">Родить мир</button>
    </form>
  </section>

  <div class="atlas-wizard atlas-section" id="atlas-wizard" hidden>
    <h2 data-i18n="atlas.wizard.title">Мастер рождения</h2>
    <label class="atlas-field atlas-field--wide">
      <span data-i18n="atlas.wizard.synopsis">Синопсис новой жизни (1–3 предложения)</span>
      <textarea id="atlas-wizard-synopsis"></textarea>
    </label>
    <label class="atlas-field">
      <span data-i18n="atlas.wizard.name">Имя (необязательно — пустое даёт случайное)</span>
      <input id="atlas-wizard-name">
    </label>
    <label class="atlas-field atlas-field--wide">
      <span data-i18n="atlas.wizard.hints">Подсказки: пол, раса, происхождение</span>
      <textarea id="atlas-wizard-hints"></textarea>
    </label>
    <label class="atlas-field">
      <span data-i18n="atlas.wizard.age">Начальный возраст</span>
      <input id="atlas-wizard-age" type="number" min="0" max="100" value="5">
    </label>
    <label class="atlas-field atlas-field--check">
      <input id="atlas-wizard-isekai" type="checkbox">
      <span data-i18n="atlas.wizard.isekai">Режим переигровки в том же мире</span>
    </label>
    <button type="button" id="atlas-wizard-start" data-i18n="atlas.wizard.start">Начать новую жизнь</button>
  </div>

  <section class="atlas-section atlas-map-section" aria-label="Прорисовка карты">
    <h2 data-i18n="map.title">Прорисовка карты</h2>
    <div class="atlas-map" id="atlas-map-viewport">
      <canvas class="atlas-map-canvas" id="atlas-map-canvas"></canvas>
      <p class="atlas-map-status" id="atlas-map-status" data-i18n="atlas.map.status">Карта дорисовывается по мере путешествий героя.</p>
    </div>
  </section>

  <section class="atlas-section atlas-graph-section" aria-label="Граф отношений">
    <h2 data-i18n="graph.title">Граф отношений</h2>
    <div class="atlas-graph" id="atlas-graph-viewport">
      <canvas class="atlas-graph-canvas" id="atlas-graph-canvas"></canvas>
      <p class="atlas-graph-status" id="atlas-graph-status" data-i18n="atlas.graph.status">Связи между персонажами из социального графа.</p>
    </div>
  </section>

  <script src="/static/map.js"></script>
  <script src="/static/graph.js"></script>
</div>
