# Единый сетевой гейт (T-01-11): белый список внешних хостов.
# Запись — hostname (`host`) или диапазон (`host/cidr`). Проверка выполняется по
# hostname до установки соединения; редирект за пределы списка не выполняется.
netgate:
  allowed_hosts:
    - generativelanguage.googleapis.com  # внешний API слота (Gemini, B-4)
    - huggingface.co                      # HF — менеджер моделей (MD-09.1)
    - region1.v2.argotunnel.com           # край туннеля cloudflared (F-04.3)
    - region2.v2.argotunnel.com           # край туннеля cloudflared (F-04.3)

# Порт-гейт при старте (T-01-12): белый список слушающих адресов ядра.
# Сокет обязан быть на loopback (127.0.0.1 или ::1) и на порту из списка;
# чужой слушающий сокет — отказ старта (код 3, event=portgate.deny).
ports:
  whitelist:
    - 127.0.0.1:8720   # веб-интерфейс игрока на loopback (T-08-02)
    - 127.0.0.1:5001   # генерация (:5001)
    - 127.0.0.1:5002   # эмбеддинги BGE-M3 (:5002)

# Двухголосие подтверждения (T-03-04): пороги словарного и векторного голосов.
# dict_match ≥ dict_threshold и cos ≥ vector_threshold — подтверждено; при
# расхождении словарь главнее. Запас (margin) — дерзкий режим, коммит сразу.
confirm:
  dict_threshold: 0.6
  vector_threshold: 0.75
  margin_dict: 0.7
  margin_vector: 0.85

# Резиденты ядра (T-01-13): постоянные дети надзирателя. Надзиратель запускает,
# лечит падения (пауза 5/10/20/30/60 с) и по SIGTERM/SIGINT гасит в обратном
# порядке. Поля ребёнка: name, cmd, args, port, health_path, ready_timeout
# (по умолчанию 600s), poll_interval (по умолчанию 2s). Команды генерации
# (:5001) и эмбеддингов (:5002) подключаются задачами модельного слоя — сейчас
# детей нет.
#   - name: llama
#     cmd: bin/llama-server
#     args:
#       - -m
#       - models/generation.gguf
#     port: 5001
#     health_path: /health
children: []
