# Единый сетевой гейт (T-01-11): белый список внешних хостов.
# Запись — hostname (`host`), поддомены (`*.example`) или диапазон (`host/cidr`).
# Проверка выполняется по hostname до установки соединения; редирект за пределы
# списка не выполняется.
netgate:
  allowed_hosts:
    - generativelanguage.googleapis.com  # внешний API слота (Gemini, B-4)
    - huggingface.co                      # HF — менеджер моделей (MD-09.1)
    - "*.huggingface.co"                  # CDN LFS: HF отдаёт файл редиректом
    - "*.hf.co"                           # Xet/CDN: us.aws.cdn.hf.co и другие
    - github.com                          # поставка llama.cpp (T-13-06, T-12-18)
    - objects.githubusercontent.com       # ассеты релизов GitHub (редирект LFS)
    - region1.v2.argotunnel.com           # край туннеля cloudflared (F-04.3)
    - region2.v2.argotunnel.com           # край туннеля cloudflared (F-04.3)
    - api.telegram.org                    # Telegram Bot API (F-04.4, T-08-03)

# Порт-гейт при старте (T-01-12): белый список слушающих адресов ядра.
# Сокет обязан быть на loopback (127.0.0.1 или ::1) и на порту из списка;
# чужой слушающий сокет — отказ старта (код 3, event=portgate.deny).
ports:
  whitelist:
    - 127.0.0.1:8720   # веб-интерфейс игрока на loopback (T-08-02)
    - 127.0.0.1:5001   # генерация (:5001)
    - 127.0.0.1:5002   # эмбеддинги BGE-M3 (:5002)

# Веб-интерфейс игрока (T-08-02): слушает только loopback; наружных слушающих
# сокетов нет. host — строго 127.0.0.1 или localhost, иное — ошибка старта.
web:
  host: 127.0.0.1
  port: 8720

# LLM-слоты (T-08-09, MD-04): генерация :5001 и эмбеддинги :5002. Адрес, модель,
# тайм-аут, максимум токенов, температура, повторы, конкурентность; локальные
# вычисления; семплирование. Ключи слотов вводятся в UI и хранятся в settings.toml
# под именами llm_gen и llm_embed (B-4); сюда наружу они не попадают.
llm:
  gen_addr: ":5001"
  gen_model: ""
  gen_timeout: 30s
  gen_max_tokens: 0
  gen_temperature: 0.0
  gen_retries: 0
  gen_concurrency: 1
  embed_addr: ":5002"
  embed_model: ""
  embed_timeout: 30s
  # Путь к llama-server; пусто — автоопределение (bin/ → PATH → сборки,
  # T-13-06). Заполняется визардом и ручной проверкой пути.
  llama_server_path: ""
  local: true
  sampling: greedy

# Слоты генерации (T-03-18, MD-04/MD-05): заводской реестр пресетов — local
# (локальная запаска :5001), gemini-flash, gemini-pro (внешний провайдер).
# Дефолт — local; сброс возвращает локальный пресет. Внешний хост — в белом
# списке netgate; ключ провайдера вводится в UI и хранится в settings.toml.
slots:
  default: local
  gemini_host: generativelanguage.googleapis.com

# Исходящий туннель (T-08-03, F-04.3): станок сам подключается к краю cloudflared
# и пробрасывает loopback-адрес веб-интерфейса. Поля внешнего слушающего адреса
# нет — только исходящие параметры (edge, local). Telegram-канал (F-04.4) решает
# NAT исходящим соединением: бот шлёт getUpdates/sendMessage наружу, входящих
# сокетов нет; пустые token/chat_id — канал не настроен.
tunnel:
  edge: region1.v2.argotunnel.com
  local: http://127.0.0.1:8720
  telegram_token: ""
  telegram_chat_id: ""

# Двухголосие подтверждения (T-03-04): пороги словарного и векторного голосов.
# dict_match ≥ dict_threshold и cos ≥ vector_threshold — подтверждено; при
# расхождении словарь главнее. Запас (margin) — дерзкий режим, коммит сразу.
confirm:
  dict_threshold: 0.6
  vector_threshold: 0.75
  margin_dict: 0.7
  margin_vector: 0.85

# Оседание (T-04-04): порог смыслового дедупа — косинусная близость вектора
# очищенной сцены к существующим записям не ниже порога означает дубль по смыслу.
sediment:
  dedup_threshold: 0.85

# Пила (T-03-06): пилообразный сигнал глубины хода — нагнетание медленное,
# разрядка резкая; амплитуду и период модулирует психотип (LT-09.7). Рекомендация:
# s ≥ peak — Ткач, s < flat — банк, между — без рекомендации.
saw:
  rise_min: 0.03
  rise_max: 0.08
  peak: 0.8
  fall: 0.35
  flat: 0.3

# Скоринг композиции (T-10-09, SCR-§3.1): веса формулы и параметры жёстких
# правил SCR-§3.2. Инвариант загрузки — w_family ≤ 0.30, нарушение — отказ старта.
composition:
  w_family: 0.28
  w_secondary: 0.18
  w_technique: 0.15
  w_moral: 0.12
  w_mood: 0.10
  w_quality: 0.10
  w_freshness: 0.07
  family_only_penalty: 0.10
  inversion_boost: 0.10
  adjacent_penalty: 0.15  # штраф близкой пары primary+secondary (T-10-13, SCR-§3.2.5)

# Время 1:1 (T-03-12, LT-10.10): единственная константа ночи — молчание дольше
# этого числа минут означает ночь. Её же читают T-03-14 и T-05-01.
time:
  night_threshold_min: 480

# Паганель (T-06-05, T-06-10): переключатель «включён» — ковка колец. При false
# кольцо в очередь rings не ставится. Разведка наружу (W-10): переключатель
# «походы наружу» (scout_enabled), бюджет сессии, тайм-аут целевого вызова и
# ссылка на ключ внешней модели (сам ключ — в settings.toml, B-4).
paganel:
  enabled: true
  build_budget: 10   # отдельный бюджет достройки кольца/коридора (T-06-09, W-11.2)
  scout_enabled: false  # «походы наружу»; false — внешних вызовов нет (F-08)
  scout_budget: 3       # вызовов разведки на сессию (W-10.4)
  scout_timeout: 30s    # тайм-аут целевого вызова разведки (W-10.3)
  key_ref: paganel      # ссылка на ключ внешней модели в settings.toml (B-4)

# Резиденты ядра (T-01-13): постоянные дети надзирателя. Надзиратель запускает,
# лечит падения (пауза 5/10/20/30/60 с) и по SIGTERM/SIGINT гасит в обратном
# порядке. Поля ребёнка: name, cmd, args, port, health_path, ready_timeout
# (по умолчанию 600s), poll_interval (по умолчанию 2s). Команды генерации
# (:5001) и эмбеддингов (:5002) подключаются задачами модельного слоя — сейчас
# детей нет.
#   - name: llama
#     cmd: bin/llama-server
#     args:
#       - -m
#       - models/generation.gguf
#     port: 5001
#     health_path: /health
children: []
